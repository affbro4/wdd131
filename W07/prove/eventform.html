<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Form</title>
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main class="wrapper">
        <h1>Event Ticket</h1>
        <form id="eventForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required />
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required/>
            </div>

            <div class="field">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="date">Event Date</label> 
                <input type="date" name="date" id="date" required />
            </div>

            <div class="studentNum">
                <label for="studentNumber"> Student #</label>
                <input type="text" name="studentNumber" id="studentNumber" required/>
            </div>

            <div class="code">
                <label for="accessCode"> Access Code</label>
                <input type="text" name="code" id="code" required/>

            </div>

            <button class="full" type="submit">Create Ticket</button>

            <section id="output" aria-live="polite"></section>

            

        </form>
    </main>
</body>
</html>
